<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>SCC HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@700&family=Fraunces:opsz,wght@9..144,400&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* Recoleta is licensed; served from our own Worker, which reads it from the SCC Shopify theme */
  @font-face { font-family:'Recoleta'; font-weight:400; font-display:swap;
    src:url('https://scc-hq.black-bread-143b.workers.dev/fonts/recoleta-regular.woff2') format('woff2'); }

  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --dusty:#889CA2; --yellow:#F3B548; --coral:#F49C8E; --text:#555555; --white:#FFFFFF;
    --gray:#F2F2F2; --blush:#F6D5CD; --mint:#EEF6F1; --slate:#5E7278; --line:#DFE6E8;
    /* status colors: functional, not decorative */
    --good:#6BAF8A; --warn:#F4A24A; --bad:#E07070;
    --display:'Recoleta','Fraunces',Georgia,serif;
    --label:'Quicksand',Helvetica,Arial,sans-serif;
    --body:'Nunito',Helvetica,Arial,sans-serif;
  }
  html, body { background:var(--white); }
  body { font-family:var(--body); color:var(--text); font-size:15px; line-height:1.6; min-height:100vh; }
  button { font-family:var(--label); cursor:pointer; }
  a { color:inherit; }
  :focus-visible { outline:2px solid var(--dusty); outline-offset:2px; }

  /* Type */
  .h-hero { font-family:var(--display); font-weight:400; color:var(--dusty); font-size:clamp(30px,5vw,40px); line-height:1.15; }
  .h-sec  { font-family:var(--display); font-weight:400; color:var(--dusty); font-size:24px; line-height:1.25; }
  .h-card { font-family:var(--display); font-weight:400; color:var(--dusty); font-size:20px; line-height:1.25; }
  .eyebrow { font-family:var(--label); font-weight:700; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--coral); }
  .lab { font-family:var(--label); font-weight:700; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--dusty); }
  .num { font-family:var(--body); font-weight:600; color:var(--text); }
  .muted { color:var(--dusty); }
  .small { font-size:12.5px; }

  /* Header band */
  .hq-top { background:var(--gray); }
  .hq-top-in { max-width:1040px; margin:0 auto; padding:18px 20px 0; }
  .hq-brandrow { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .hq-brand { display:flex; align-items:center; gap:14px; min-width:0; }
  .hq-logo { height:34px; width:auto; display:none; }
  .hq-title { font-family:var(--display); font-weight:400; color:var(--dusty); font-size:28px; line-height:1; }
  .hq-tools { display:flex; align-items:center; gap:10px; }
  .sync { font-family:var(--label); font-weight:700; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--dusty); }
  .sync.err { color:var(--bad); }

  .nav { display:flex; gap:6px; margin-top:16px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .nav-btn { background:transparent; border:0; border-bottom:2px solid transparent; padding:10px 14px 12px;
    font-family:var(--label); font-weight:700; font-size:13px; letter-spacing:2px; text-transform:uppercase;
    color:var(--text); white-space:nowrap; display:flex; align-items:center; gap:8px; }
  .nav-btn.on { color:var(--dusty); border-bottom-color:var(--dusty); }
  .nav-count { background:var(--coral); color:#fff; border-radius:50px; padding:1px 8px; font-size:11px; letter-spacing:0; }
  .nav-count.zero { background:var(--line); color:var(--text); }

  .wrap { max-width:1040px; margin:0 auto; padding:28px 20px 64px; }

  /* Controls */
  .pill { display:inline-block; background:#fff; color:var(--dusty); border:1px solid var(--dusty); border-radius:50px;
    font-family:var(--label); font-weight:700; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    padding:7px 15px; white-space:nowrap; transition:background .15s, color .15s; }
  .pill:hover { background:var(--gray); }
  .pill.on { background:var(--dusty); color:#fff; }
  .pill.sm { padding:5px 12px; font-size:10.5px; }
  .btn-primary { display:inline-block; background:var(--yellow); color:#fff; border:0; border-radius:50px;
    font-family:var(--label); font-weight:700; font-size:12px; letter-spacing:3px; text-transform:uppercase; padding:16px 34px; }
  .linklab { font-family:var(--label); font-weight:700; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:var(--coral); text-decoration:none; background:none; border:0; padding:0; }
  .linklab:hover { text-decoration:underline; }
  input[type="date"], input[type="password"] { font-family:var(--body); font-size:14px; color:var(--text);
    border:1px solid var(--line); border-radius:12px; padding:8px 12px; background:#fff; outline:none; }
  input:focus { border-color:var(--dusty); }

  /* Cards */
  .card { background:#fff; border:1px solid var(--line); border-radius:18px; }
  .stat { padding:18px 20px; }
  .stat .v { font-family:var(--body); font-weight:600; font-size:28px; line-height:1.15; margin-top:6px; color:var(--text); }
  .stat .c { font-size:12px; color:var(--dusty); margin-top:4px; }
  .grid { display:grid; gap:12px; }
  .g3 { grid-template-columns:repeat(3,1fr); }
  .g4 { grid-template-columns:repeat(4,1fr); }
  .row-between { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .range-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .offer-card { padding:18px 20px; cursor:pointer; transition:border-color .15s; }
  .offer-card:hover { border-color:var(--dusty); }

  .list { overflow:hidden; }
  .row { border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row-in { display:flex; align-items:flex-start; gap:12px; padding:15px 18px; cursor:pointer; border-left:3px solid transparent; transition:background .15s; }
  .row-in:hover { background:#FAFAFA; }
  .row-name { font-weight:600; color:var(--text); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-sub { font-size:12px; color:var(--dusty); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
  .badge { display:inline-block; background:#fff; border:1px solid; border-radius:50px; padding:3px 10px;
    font-family:var(--label); font-weight:700; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; white-space:nowrap; }
  .chev { display:inline-block; transition:transform .2s; color:var(--dusty); font-size:18px; user-select:none; }
  .chev.open { transform:rotate(180deg); }

  .cb { width:20px; height:20px; border-radius:6px; flex-shrink:0; border:1.5px solid var(--dusty); background:#fff;
    margin-top:2px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .cb.on { background:var(--good); border-color:var(--good); }
  .cb.on::after { content:'✓'; color:#fff; font-size:13px; font-weight:700; line-height:1; }

  .detail { display:none; background:var(--gray); padding:20px; border-top:1px solid var(--line); }
  .detail.open { display:block; }
  .callout { background:#fff; border:1px solid var(--line); border-left:3px solid var(--dusty); border-radius:12px; padding:13px 16px; }
  .alert { border-radius:12px; padding:12px 16px; margin-bottom:14px; font-size:13.5px; border:1px solid; background:#fff; }
  .kv-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .kv .v { font-weight:600; font-size:15px; color:var(--text); margin-top:2px; }
  .prod-row, .prune-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .prod-row:last-child, .prune-row:last-child { border-bottom:0; }
  .chart-box { position:relative; height:220px; }
  .empty { text-align:center; padding:48px 20px; color:var(--text); }

  /* Notifications */
  .note { padding:18px 20px; border-left:3px solid var(--line); }
  .note.need { border-left-color:var(--bad); }
  .note-title { font-weight:600; color:var(--text); font-size:15.5px; line-height:1.4; }
  .note-details { margin-top:6px; font-size:14px; line-height:1.7; white-space:pre-wrap; word-break:break-word; }
  .note-details.clamp { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .note-meta { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; font-size:12px; color:var(--dusty); }
  .note-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .brand-tag { font-family:var(--label); font-weight:700; font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
    border:1px solid var(--dusty); color:var(--dusty); border-radius:50px; padding:2px 9px; }
  .note.leaving { opacity:.35; transition:opacity .25s; }

  /* Login */
  .login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--gray); }
  .login-card { width:100%; max-width:400px; padding:40px 32px; text-align:center; }
  .login-card input { width:100%; margin:24px 0 16px; padding:13px 16px; font-size:15px; text-align:center; }
  .login-card .btn-primary { width:100%; }
  .login-err { color:var(--bad); font-size:13px; min-height:20px; margin-top:12px; }

  @media (max-width:720px) {
    .g3, .g4 { grid-template-columns:repeat(2,1fr); }
    .kv-grid { grid-template-columns:repeat(2,1fr); }
    .offer-lower { grid-template-columns:1fr !important; }
    .camp-right { display:none !important; }
    .camp-right-mobile { display:flex !important; }
    .row-name { white-space:normal; }
    .stat .v { font-size:22px; }
    .hq-title { font-size:24px; }
    .chart-box { height:180px; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<div id="login" class="login" style="display:none;">
  <div class="card login-card">
    <div class="eyebrow">Simple Creator Co.</div>
    <h1 class="h-hero" style="margin-top:10px;">SCC HQ</h1>
    <p style="margin-top:8px;">Enter the team password to open the dashboard.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" />
    <button id="login-btn" class="btn-primary">Log in</button>
    <div id="login-err" class="login-err" role="alert"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <header class="hq-top">
    <div class="hq-top-in">
      <div class="hq-brandrow">
        <div class="hq-brand">
          <img id="logo" class="hq-logo" alt="Simple Creator Co." />
          <span class="hq-title">SCC HQ</span>
        </div>
        <div class="hq-tools">
          <span id="sync-status" class="sync">Syncing</span>
          <button id="refresh-btn" class="pill sm">Refresh</button>
          <button id="logout-btn" class="linklab">Log out</button>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
    </div>
  </header>
  <main class="wrap"><div id="view"></div></main>
</div>
<script>
/* ══════════════════════════════════════════════════════════
   SCC HQ v1 · tabs: Notifications, Ads (Overview is next)
   This page holds NO keys or sheet IDs. All data comes from the
   private scc-hq Worker, behind a login.
   ══════════════════════════════════════════════════════════ */

var API = 'https://scc-hq.black-bread-143b.workers.dev';
var TOKEN_KEY = 'scc-hq-token';

var HQ_TAB = null;             // 'notifications' | 'ads'
var INBOX = { items: [], loaded: false, error: null, setup: false };
var inboxFilter = 'all';       // all | SCC | RRP
var showSnoozed = false;
var expandedNotes = {};

/* ── Small helpers ─────────────────────────────────────── */
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return window.__tok || null; } }
function setToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) { window.__tok = t; } }
function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} window.__tok = null; }

function api(path, opts) {
  opts = opts || {};
  var headers = { 'Authorization': 'Bearer ' + (getToken() || '') };
  if (opts.body) headers['Content-Type'] = 'application/json';
  return fetch(API + path, { method: opts.method || 'GET', headers: headers, body: opts.body ? JSON.stringify(opts.body) : undefined })
    .then(function (r) {
      if (r.status === 401) { clearToken(); showLogin('Please log in again.'); throw new Error('auth'); }
      return r.json();
    });
}
function timeAgo(iso) {
  var d = new Date(iso); if (isNaN(d)) return '';
  var m = Math.round((Date.now() - d.getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  var h = Math.round(m / 60);
  if (h < 24) return h + ' hr ago';
  var days = Math.round(h / 24);
  if (days < 7) return days + ' day' + (days === 1 ? '' : 's') + ' ago';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

/* ── Login ────────────────────────────────────────────── */
function showLogin(msg) {
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('login-err').textContent = msg || '';
  setTimeout(function () { var p = document.getElementById('pw'); if (p) p.focus(); }, 50);
}
function doLogin() {
  var pw = document.getElementById('pw').value;
  var btn = document.getElementById('login-btn');
  if (!pw) return;
  btn.disabled = true; btn.textContent = 'Checking';
  fetch(API + '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      btn.disabled = false; btn.textContent = 'Log in';
      if (j.ok && j.token) { setToken(j.token); document.getElementById('pw').value = ''; startApp(); }
      else document.getElementById('login-err').textContent = j.error === 'Wrong password' ? 'That password didn\u2019t match. Try again.' : (j.error || 'Login failed.');
    })
    .catch(function () {
      btn.disabled = false; btn.textContent = 'Log in';
      document.getElementById('login-err').textContent = 'Couldn\u2019t reach the server. Check your connection and try again.';
    });
}
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('logout-btn').addEventListener('click', function () { clearToken(); showLogin(); });

/* ── Shell ────────────────────────────────────────────── */
function needsYouCount() {
  var n = 0;
  for (var i = 0; i < INBOX.items.length; i++) {
    var it = INBOX.items[i];
    if (it.status === 'New' && it.type === 'Needs you') n++;
  }
  return n;
}
function renderNav() {
  var n = needsYouCount();
  var tabs = [['notifications', 'Notifications', n], ['ads', 'Ads', null]];
  var h = '';
  for (var i = 0; i < tabs.length; i++) {
    var on = HQ_TAB === tabs[i][0];
    h += '<button class="nav-btn' + (on ? ' on' : '') + '" data-act="hq-tab" data-v="' + tabs[i][0] + '"' + (on ? ' aria-current="page"' : '') + '>' + tabs[i][1];
    if (tabs[i][2] !== null && INBOX.loaded) h += '<span class="nav-count' + (tabs[i][2] ? '' : ' zero') + '">' + tabs[i][2] + '</span>';
    h += '</button>';
  }
  document.getElementById('nav').innerHTML = h;
}
function setSync(text, isErr) {
  var s = document.getElementById('sync-status');
  s.textContent = text; s.className = 'sync' + (isErr ? ' err' : '');
}
function render() {
  renderNav();
  if (HQ_TAB === 'notifications') renderNotifications();
  else if (PAGE === 'offer') renderOffer();
  else renderMain();
  setTimeout(broadcastHeight, 120);
}

/* ── Notifications tab ────────────────────────────────── */
function loadInbox() {
  return api('/api/inbox').then(function (j) {
    INBOX.loaded = true;
    if (j.ok) { INBOX.items = j.items || []; INBOX.error = null; INBOX.setup = false; }
    else { INBOX.error = j.error || 'Could not load notifications.'; INBOX.setup = !!j.setup; }
  }).catch(function (e) {
    if (e.message === 'auth') throw e;
    INBOX.loaded = true; INBOX.error = 'Could not reach the server.';
  });
}
function noteHTML(it) {
  var need = it.type === 'Needs you' && it.status === 'New';
  var long = (it.details || '').length > 220;
  var open = !!expandedNotes[it.id];
  var h = '<div class="card note' + (need ? ' need' : '') + '" id="note-' + esc(it.id) + '">';
  h += '<div class="note-title">' + esc(it.item) + '</div>';
  if (it.details) {
    h += '<div class="note-details' + (long && !open ? ' clamp' : '') + '">' + esc(it.details) + '</div>';
    if (long) h += '<button class="linklab" style="margin-top:6px;" data-act="note-more" data-v="' + esc(it.id) + '">' + (open ? 'Show less' : 'Show more') + '</button>';
  }
  h += '<div class="note-meta">';
  if (it.brand) h += '<span class="brand-tag">' + esc(it.brand) + '</span>';
  if (it.source) h += '<span>' + esc(it.source) + '</span>';
  h += '<span>' + esc(timeAgo(it.created)) + '</span></div>';
  h += '<div class="note-actions">';
  h += '<button class="pill sm" data-act="note-set" data-v="' + esc(it.id) + '" data-s="Done">Mark done</button>';
  if (it.status === 'Snoozed') h += '<button class="pill sm" data-act="note-set" data-v="' + esc(it.id) + '" data-s="New">Unsnooze</button>';
  else h += '<button class="pill sm" data-act="note-set" data-v="' + esc(it.id) + '" data-s="Snoozed">Snooze</button>';
  if (it.link) h += '<a class="linklab" href="' + esc(it.link) + '" target="_blank" rel="noopener">Open link</a>';
  h += '<a class="linklab" href="' + esc(it.url) + '" target="_blank" rel="noopener">Open in Notion</a>';
  h += '</div></div>';
  return h;
}
function renderNotifications() {
  var v = document.getElementById('view');
  var h = '<div class="row-between" style="margin-bottom:22px;align-items:flex-end;">';
  h += '<div><div class="eyebrow">From your AI team</div><h1 class="h-hero" style="margin-top:8px;">Notifications</h1></div>';
  h += '<div class="range-row">' + pillHTML('All', 'inbox-filter', 'all', inboxFilter === 'all') +
       pillHTML('SCC', 'inbox-filter', 'SCC', inboxFilter === 'SCC') + pillHTML('RRP', 'inbox-filter', 'RRP', inboxFilter === 'RRP') + '</div>';
  h += '</div>';

  if (!INBOX.loaded) { v.innerHTML = h + '<div class="card empty">Loading notifications</div>'; return; }
  if (INBOX.error) {
    h += '<div class="card" style="padding:22px 24px;"><div class="h-card">' + (INBOX.setup ? 'Notion isn\u2019t connected yet' : 'Notifications didn\u2019t load') + '</div>';
    h += '<p style="margin-top:8px;">' + esc(INBOX.error) + '</p></div>';
    v.innerHTML = h; return;
  }

  var match = function (it) {
    if (inboxFilter === 'all') return true;
    return it.brand === inboxFilter || it.brand === 'Both';
  };
  var need = [], fyi = [], snoozed = [];
  for (var i = 0; i < INBOX.items.length; i++) {
    var it = INBOX.items[i];
    if (!match(it)) continue;
    if (it.status === 'Snoozed') snoozed.push(it);
    else if (it.type === 'Needs you') need.push(it);
    else fyi.push(it);
  }

  if (!need.length && !fyi.length) {
    h += '<div class="card" style="padding:40px 24px;text-align:center;"><div class="h-card">All clear</div>' +
         '<p style="margin-top:6px;">Nothing needs you right now. New items from scheduled tasks and skills show up here.</p></div>';
  }
  if (need.length) {
    h += '<h2 class="h-sec" style="margin:4px 0 12px;">Needs You</h2><div class="grid" style="margin-bottom:28px;">';
    for (var a = 0; a < need.length; a++) h += noteHTML(need[a]);
    h += '</div>';
  }
  if (fyi.length) {
    h += '<h2 class="h-sec" style="margin:4px 0 12px;">For Your Information</h2><div class="grid" style="margin-bottom:28px;">';
    for (var b = 0; b < fyi.length; b++) h += noteHTML(fyi[b]);
    h += '</div>';
  }
  if (snoozed.length) {
    h += '<button class="pill" data-act="toggle-snoozed" style="margin-top:4px;">' + (showSnoozed ? 'Hide' : 'Show') + ' snoozed (' + snoozed.length + ')</button>';
    if (showSnoozed) {
      h += '<div class="grid" style="margin-top:14px;">';
      for (var c = 0; c < snoozed.length; c++) h += noteHTML(snoozed[c]);
      h += '</div>';
    }
  }
  v.innerHTML = h;
}
function setNoteStatus(id, status, btn) {
  var card = document.getElementById('note-' + id);
  if (card) card.classList.add('leaving');
  if (btn) btn.disabled = true;
  api('/api/inbox/' + id, { method: 'POST', body: { status: status } }).then(function (j) {
    if (!j.ok) {
      if (card) card.classList.remove('leaving');
      if (btn) btn.disabled = false;
      alert('Couldn\u2019t update that item: ' + (j.error || 'unknown error'));
      return;
    }
    for (var i = 0; i < INBOX.items.length; i++) {
      if (INBOX.items[i].id === id) {
        if (status === 'Done') INBOX.items.splice(i, 1);
        else INBOX.items[i].status = status;
        break;
      }
    }
    render();
  }).catch(function (e) {
    if (e.message === 'auth') return;

<script>

/* ── Dates ────────────────────────────────────────────── */

}

/* ── Numbers ──────────────────────────────────────────── */
function num(v) { if (v === null || v === undefined || v === '') return 0; var n = parseFloat(String(v).replace(/[$,%\s]/g, '')); return isNaN(n) ? 0 : n; }
function numOrNull(v) { if (v === null || v === undefined || v === '') return null; var n = parseFloat(String(v).replace(/[$,%\s]/g, '')); return isNaN(n) ? null : n; }

function fR(v) { return (v === null || v === undefined || isNaN(v)) ? '–' : Number(v).toFixed(2); }

function fPct(v) { return (v === null || v === undefined || isNaN(v)) ? '–' : Number(v).toFixed(1) + '%'; }

/* ── Parsers ──────────────────────────────────────────── */

}

function buildAdsets() {

      var cpmv = num(rw[M_CPM]); if (cpmv > 0) { dm.cpm += cpmv; dm.cpc += num(rw[M_CPC]); dm.ctr += num(rw[M_CTR]); dm.cn++; }

    var newest = null;

    var pruneKill = [], pruneWatch = [];

      if (!adMap.hasOwnProperty(an2)) continue;
      var a2 = adMap[an2];

      id: idToken(name) || idToken(camp2) || null, budget: budget, dayMap: dayMap, adMap: adMap, acctDaySpend: acctDaySpend,
      firstSeen: firstSeen, daysLive: daysLive, isNew: daysLive < 3,

function winFor(s, from, to) {

  for (var dk in s.dayMap) {
    if (!s.dayMap.hasOwnProperty(dk)) continue;
    var d = parseDate(dk);

function enrich(list) {

    s.hyrosMatched = !!(s.hyRaw.d7 || s.hyRaw.d30 || s.hyRaw.y);
    s.y = winFor(s, daysAgo(1), todayMid());
    s.d7 = winFor(s, daysAgo(7), todayMid());
    s.d14 = winFor(s, daysAgo(14), todayMid());
    s.d30 = winFor(s, daysAgo(30), todayMid());

    var m7 = s.d7.metaRoas, h7 = s.hy.r7, mY = s.y.metaRoas, hY = s.hy.yRoas;
    var scale7 = (m7 !== null && m7 >= SCALE_T) || (h7 !== null && h7 >= SCALE_T);
    var yestBothWeak = (mY === null || mY < SCALE_T) && (hY === null || hY < SCALE_T);
    var primary = (h7 !== null) ? h7 : m7;
    var sales7 = s.d7.purch + (s.hy.sales7 || 0);

      else if (primary < 1.0) status = 'scale_back';

    else if (primary === null) status = 'hold';

    else {

}

function buildInsight(s) {
  var m7 = s.d7.metaRoas, h7 = s.hy.r7, mY = s.y.metaRoas, hY = s.hy.yRoas, m14 = s.d14.metaRoas;

    if (mA && hA) parts.push('Meta 7-day ' + fR(m7) + ' and Hyros 7-day ' + fR(h7) + ', both above the scale threshold.');
    else if (mA) parts.push('Meta 7-day ROAS ' + fR(m7) + ' is above the scale threshold.' + (h7 !== null ? ' Hyros: ' + fR(h7) + '.' : ''));
    else if (hA) parts.push('Hyros 7-day ROAS ' + fR(h7) + ' is above the scale threshold.' + (m7 !== null ? ' Meta: ' + fR(m7) + '.' : ''));
    if ((mY !== null && mY >= SCALE_T) || (hY !== null && hY >= SCALE_T))
      parts.push('Yesterday was strong too: ' + (mY !== null ? 'Meta ' + fR(mY) : '') + (hY !== null ? ', Hyros ' + fR(hY) : '') + '.');
    if (s.d7.cpm !== null && s.d7.cpm <= 20) parts.push('CPM ' + fD(s.d7.cpm) + ', healthy delivery.');
  } else if (s.status === 'scale_back') {
    var pb = (h7 !== null) ? h7 : m7;
    parts.push('7-day ROAS ' + fR(pb) + ' is below break-even. Retargeting never gets turned off; trim the budget and let the pool recover.');
    if (s.d7.freq !== null && s.d7.freq >= RT_FREQ_ALERT) parts.push('Frequency ' + s.d7.freq.toFixed(1) + 'x means the audience is saturated.');
  } else if (s.status === 'turn_off') {
    if ((s.d7.purch + (s.hy.sales7||0)) === 0) parts.push('No sales in 7 days on ' + fC(s.d7.spend) + ' spend. Turn it off.');
    else parts.push('Meta ' + fR(m7) + ' and Hyros ' + fR(h7) + ' are both below the turn-off threshold (' + OFF_T + ').');
  } else if (s.status === 'orange') {
    var p = (h7 !== null) ? h7 : m7;
    if (p !== null && p >= 1.0) parts.push('7-day ROAS ' + fR(p) + ' is above break-even but trending down against the 14-day (' + fR(m14) + ').');
    else parts.push('7-day ROAS ' + fR(p) + ' is below break-even. Yesterday was ' + fR(hY !== null ? hY : mY) + ', so watch before making the turn-off call.');
  } else if (s.status === 'new_watch') {
    var sold = s.d7.purch;
    parts.push('Day ' + (s.daysLive + 1) + ' of 3. ' + (sold > 0 ? sold + ' sale' + (sold===1?'':'s') + ' so far.' : 'No sales yet. Turns off if still zero after Day 3.'));
  } else if (s.status === 'traffic') {
    parts.push('Traffic or engagement placement with no ROAS target. Reference only.');
  } else {
    var ph = (h7 !== null) ? h7 : m7;
    parts.push(ph !== null ? '7-day ROAS ' + fR(ph) + ' is stable. No action needed.' : 'Not enough data yet, holding.');
  }
  if (!s.traffic && s.creativeAge !== null && s.creativeAge >= CREATIVE_AGE_DAYS)
    parts.push('Newest creative is ' + s.creativeAge + ' days old. Time to refresh.');
  return parts.join(' ');
}

function offerStats(offerKey, from, to) {

    }
  }

  h += '<div class="row-between" style="margin-bottom:20px;align-items:flex-end;">';
  h += '<h1 class="h-hero">Ads</h1><div class="range-row">';
  h += pillHTML('Yesterday', 'main-range', 'y', mainRange === 'y') + pillHTML('7-Day', 'main-range', 'd7', mainRange === 'd7') +
       pillHTML('30-Day', 'main-range', 'd30', mainRange === 'd30') + pillHTML('Custom', 'main-range', 'custom', mainRange === 'custom');
  if (mainRange === 'custom') h += '<input type="date" id="mn-from" value="' + (mainCustom.from || '') + '"><input type="date" id="mn-to" value="' + (mainCustom.to || '') + '">';
  h += '</div></div>';

  h += '<div class="grid g3" style="margin-bottom:12px;">';
  h += statCard('Total Spend', fC(totSpend), null);
  h += statCard('Revenue', fC(totMeta > 0 ? totMeta : null), 'Meta' + (totHyros > 0 ? ' | Hyros ' + fC(totHyros) : ''));
  h += statCard('ROAS', fR(totRoas), 'Meta' + (totHyrosRoas !== null ? ' | Hyros ' + fR(totHyrosRoas) + 'x' : ''), roasColor(totRoas));
  h += '</div>';
  var attn = gFlag.length + gOff.length + gBack.length;
  h += '<div class="grid g3" style="margin-bottom:20px;">';
  h += statCard('Active Ad Sets', String(ADSETS.length), null);
  h += statCard('Ready to Scale', String(gScale.length), null, gScale.length ? C_GOOD : null);
  h += statCard('Need Attention', String(attn), null, attn ? ((gOff.length || gBack.length) ? C_BAD : C_WARN) : null);
  h += '</div>';

  h += '<div class="card" style="padding:18px 20px 14px;margin-bottom:28px;">';
  h += '<div class="row-between" style="margin-bottom:12px;"><span class="h-card">Performance</span><div class="range-row">' +
       pillHTML('Spend and Revenue', 'main-chart', 'spend', mainChartTab === 'spend') + pillHTML('ROAS', 'main-chart', 'roas', mainChartTab === 'roas') + '</div></div>';
  h += '<div class="chart-box"><canvas id="main-chart"></canvas></div></div>';

  h += '<h2 class="h-sec" style="margin-bottom:12px;">Offers</h2>';
  var cols = OFFERS.length >= 4 ? 4 : (OFFERS.length || 1);
  h += '<div class="grid" style="grid-template-columns:repeat(' + cols + ',minmax(0,1fr));margin-bottom:32px;" id="offer-grid">';
  for (var o = 0; o < OFFERS.length; o++) {
    var od2 = OFFERS[o], os = offerStats(od2.key, b.from, b.to);
    var showRoas = os.metaRoas !== null ? os.metaRoas : os.roas;
    h += '<div class="card offer-card" data-act="offer" data-v="' + encodeURIComponent(od2.key) + '" tabindex="0" role="button">';
    h += '<div class="eyebrow" style="' + (od2.rt ? 'color:' + C_DUSTY + ';' : '') + 'letter-spacing:2px;line-height:1.4;min-height:30px;">' + (od2.rt ? 'Retargeting | ' : '') + esc(od2.label) + '</div>';
    h += '<div class="num" style="font-size:30px;line-height:1.1;margin:8px 0 4px;color:' + roasColor(showRoas) + ';">' + fR(showRoas) + '</div>';
    h += '<div class="small">Meta ROAS on ' + fC(os.spend) + ' spend</div>';
    h += '<div class="small muted" style="margin-top:2px;">' + os.sets.length + ' ad set' + (os.sets.length === 1 ? '' : 's') + '</div></div>';
  }
  h += '</div>';

  var counts = { actions: groups.actions.length, flagged: groups.flagged.length, new: groups.new.length, all: groups.all.length };
  var tabDefs = [['actions',"Today\u2019s Actions"],['flagged','Orange Flags'],['new','New'],['all','All Ad Sets']];
  var headings = { actions:"Today\u2019s Action Items", flagged:'Monitor Daily, No Hasty Calls', new:'New Ad Sets Under Watch', all:'All Ad Sets' };
  h += '<div class="row-between" style="margin-bottom:12px;"><h2 class="h-sec">' + headings[TAB] + '</h2><div class="range-row">';
  for (var t = 0; t < tabDefs.length; t++) h += pillHTML(tabDefs[t][1] + ' (' + counts[tabDefs[t][0]] + ')', 'tab', tabDefs[t][0], TAB === tabDefs[t][0]);
  h += '</div></div>';

  h += '<div class="card list">';
  if (!shown.length) h += '<div class="empty">Nothing here today.</div>';
  else for (var r2 = 0; r2 < shown.length; r2++) h += rowHTML(shown[r2]);
  h += '</div>';

  document.getElementById('view').innerHTML = h;
  if (window.innerWidth <= 720) { var og = document.getElementById('offer-grid'); if (og) og.style.gridTemplateColumns = 'repeat(2,minmax(0,1fr))'; }
  drawLineChart('main-chart', dailySeries(ADSETS, b.from, b.to), mainChartTab, 'main');
  redrawOpenDetails();
}

/* ── Ads: offer view ──────────────────────────────────── */
function renderOffer() {
  if (adsEmptyState()) return;
  var od = offerDef(CUR_OFFER);
  if (!od) { PAGE = 'main'; return renderMain(); }
  var b = rangeFor('offer'), s = offerStats(od.key, b.from, b.to);
  var h = '<button class="linklab" data-act="back" style="margin-bottom:14px;">Back to all offers</button>';
  h += '<div class="row-between" style="margin-bottom:18px;align-items:flex-end;">';
  h += '<div>' + (od.rt ? '<div class="eyebrow">Retargeting</div>' : '') + '<h1 class="h-hero" style="margin-top:' + (od.rt ? '8' : '0') + 'px;">' + esc(od.label) + '</h1></div><div class="range-row">';
  h += pillHTML('7-Day', 'of-range', 'd7', offerRange === 'd7') + pillHTML('30-Day', 'of-range', 'd30', offerRange === 'd30') + pillHTML('Custom', 'of-range', 'custom', offerRange === 'custom');
  if (offerRange === 'custom') h += '<input type="date" id="of-from" value="' + (offerCustom.from || '') + '"><input type="date" id="of-to" value="' + (offerCustom.to || '') + '">';
  h += '</div></div>';

  if (s.totalSets > 0 && s.matchedSets < s.totalSets)
    h += '<div class="alert" style="border-color:' + C_WARN + ';">Hyros matched ' + s.matchedSets + ' of ' + s.totalSets + ' ad sets here. Unmatched ones use an estimate. Check that the Hyros report uses the same ad set names.</div>';
  if (offerRange === 'custom')
    h += '<div class="alert" style="border-color:' + C_LINE + ';">Custom ranges use estimated Hyros revenue. 7-day and 30-day use exact Hyros figures.</div>';

  var cap = offerRange === 'd7' ? 'Last 7 days' : (offerRange === 'd30' ? 'Last 30 days' : 'Custom range');
  h += '<div class="grid g4" style="margin-bottom:14px;">';
  h += statCard('Ad Spend', fC(s.spend), cap);
  h += statCard('Revenue', fC(s.rev), 'Meta attributed' + (s.hyrosRev !== null ? ' | Hyros ' + fC(s.hyrosRev) : ''));
  h += statCard('ROAS', s.roas !== null ? fR(s.roas) + 'x' : '–', 'Meta' + (s.hyrosRoas !== null ? ' | Hyros ' + fR(s.hyrosRoas) + 'x' : ''), roasColor(s.roas));
  h += statCard('Profit', fC(s.profit), 'Meta revenue minus spend', s.profit !== null ? (s.profit >= 0 ? C_GOOD : C_BAD) : null);
  h += '</div>';

  h += '<div class="offer-lower" style="display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:28px;">';
  h += '<div class="card" style="padding:18px 20px 14px;"><div class="row-between" style="margin-bottom:12px;"><span class="h-card">Offer Performance</span><div class="range-row">' +
       pillHTML('Spend and Revenue', 'of-chart', 'spend', offerChartTab === 'spend') + pillHTML('ROAS', 'of-chart', 'roas', offerChartTab === 'roas') + '</div></div>';
  h += '<div class="chart-box" style="height:230px;"><canvas id="offer-chart"></canvas></div></div>';

  h += '<div style="display:flex;flex-direction:column;gap:12px;">';
  h += '<div class="card" style="padding:16px;display:flex;justify-content:space-around;gap:16px;">';
  h += '<div style="text-align:center;"><div class="lab">AOV</div><div class="num" style="font-size:24px;">' + (s.aov !== null ? '$' + Math.round(s.aov) : '–') + '</div></div>';
  h += '<div style="text-align:center;"><div class="lab">Cost per Buyer</div><div class="num" style="font-size:24px;">' + (s.cpb !== null ? '$' + Math.round(s.cpb) : '–') + '</div></div></div>';
  h += '<div class="card" style="padding:16px;flex:1;"><div class="row-between" style="margin-bottom:4px;"><span class="lab">Product</span><span class="lab">Units | Conv.</span></div>';
  if (!s.products.length) {
    h += '<p class="small" style="padding:8px 0;line-height:1.6;">No purchase data yet. Add a Purchases tab to the Meta sheet with Date, Order ID, Product, Amount (one row per line item). Bump and upsell rates calculate from orders automatically.</p>';
  } else {
    for (var p = 0; p < s.products.length; p++) {
      var pr = s.products[p], roleLab = { main:'Main Offer', bump:'Bump', upsell:'Upsell' }[pr.role] || pr.role;
      var conv = (pr.role !== 'main' && s.mainUnits > 0) ? Math.round((pr.units / s.mainUnits) * 100) : null;
      h += '<div class="prod-row"><div style="min-width:0;"><span style="font-weight:600;font-size:13.5px;">' + roleLab + '</span><span class="small"> | ' + esc(pr.product) + '</span></div>' +
           '<div style="display:flex;gap:14px;align-items:center;flex-shrink:0;"><span class="num" style="font-size:17px;">' + pr.units + '</span>' +
           '<span class="small" style="width:36px;text-align:right;">' + (conv !== null ? conv + '%' : '') + '</span></div></div>';
    }
  }
  h += '</div></div></div>';

  h += '<h2 class="h-sec" style="margin-bottom:12px;">Ad Sets</h2><div class="card list">';
  if (!s.sets.length) h += '<div class="empty">No active ad sets for this offer.</div>';
  else {
    var order = { scale:0, scale_back:1, turn_off:1, orange:2, new_watch:3, hold:4, traffic:5 };
    var sorted = s.sets.slice().sort(function (x, y) { return (order[x.status] === undefined ? 9 : order[x.status]) - (order[y.status] === undefined ? 9 : order[y.status]); });
    for (var s3 = 0; s3 < sorted.length; s3++) h += rowHTML(sorted[s3]);
  }
  h += '</div>';
  document.getElementById('view').innerHTML = h;
  drawLineChart('offer-chart', dailySeries(s.sets, b.from, b.to), offerChartTab, 'offer');
  redrawOpenDetails();
}

function redrawOpenDetails() {
  for (var k in openDetail) {
    if (!openDetail.hasOwnProperty(k) || !openDetail[k]) continue;
    var s = null;
    for (var i = 0; i < ADSETS.length; i++) if (ADSETS[i].key === k) s = ADSETS[i];
    if (!s) continue;
    var b = rangeFor('adset');
    drawLineChart('aschart-' + encodeURIComponent(s.key), dailySeries([s], b.from, b.to), adsetChartTab, 'as-' + k);
  }
}

/* ── Events ───────────────────────────────────────────── */
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t) return;
  var act = t.getAttribute('data-act'), v = t.getAttribute('data-v');
  if (act === 'hq-tab') { HQ_TAB = v; try { sessionStorage.setItem('scc-hq-tab', v); } catch (x) {} window.scrollTo(0, 0); render(); return; }
  if (act === 'inbox-filter') { inboxFilter = v; render(); return; }
  if (act === 'toggle-snoozed') { showSnoozed = !showSnoozed; render(); return; }
  if (act === 'note-more') { expandedNotes[v] = !expandedNotes[v]; render(); return; }
  if (act === 'note-set') { setNoteStatus(v, t.getAttribute('data-s'), t); return; }
  if (act === 'check') { e.stopPropagation(); var ck = decodeURIComponent(v); checked[ck] = !checked[ck]; saveChecked(); render(); return; }
  if (act === 'det') { var dk2 = decodeURIComponent(v); openDetail[dk2] = !openDetail[dk2]; render(); return; }
  if (act === 'tab') TAB = v;
  else if (act === 'offer') { PAGE = 'offer'; CUR_OFFER = decodeURIComponent(v); openDetail = {}; window.scrollTo(0, 0); }
  else if (act === 'back') { PAGE = 'main'; CUR_OFFER = null; openDetail = {}; }
  else if (act === 'main-range') mainRange = v;
  else if (act === 'of-range') offerRange = v;
  else if (act === 'as-range') adsetRange = v;
  else if (act === 'main-chart') mainChartTab = v;
  else if (act === 'of-chart') offerChartTab = v;
  else if (act === 'as-chart') adsetChartTab = v;
  else return;
  render();
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  var t = e.target;
  if (t && t.classList && t.classList.contains('offer-card')) t.click();
});
document.addEventListener('change', function (e) {
  var id = e.target.id, f, t2;
  if (id === 'mn-from' || id === 'mn-to') { f = document.getElementById('mn-from'); t2 = document.getElementById('mn-to'); if (f && t2 && f.value && t2.value) { mainCustom = { from:f.value, to:t2.value }; render(); } }
  if (id === 'of-from' || id === 'of-to') { f = document.getElementById('of-from'); t2 = document.getElementById('of-to'); if (f && t2 && f.value && t2.value) { offerCustom = { from:f.value, to:t2.value }; render(); } }
  if (id === 'as-from' || id === 'as-to') { f = document.getElementById('as-from'); t2 = document.getElementById('as-to'); if (f && t2 && f.value && t2.value) { adsetCustom = { from:f.value, to:t2.value }; render(); } }
});

/* ── Loading ──────────────────────────────────────────── */
function loadAds(fresh) {
  return api('/api/sheets' + (fresh ? '?fresh=1' : '')).then(function (j) {
    ADS_LOADED = true;
    if (!j.ok) { ADS_ERROR = j.fatal || j.error || 'Could not load the Meta sheet.'; return; }
    ADS_ERROR = null;
    ADS_SOFT_ERRORS = j.errors || {};
    var d = j.data || {};
    metaRows = d.meta || [];
    hyrosY = parseHyrosWindow(d.hyrosY); hyros7 = parseHyrosWindow(d.hyros7); hyros30 = parseHyrosWindow(d.hyros30);
    hyrosDailyMap = parseHyrosDaily(d.hyrosDaily);
    productRows = parseProducts(d.products); purchaseRows = parsePurchases(d.purchases);
    var built = buildAdsets(), active = [];
    for (var i = 0; i < built.length; i++) if (winFor(built[i], daysAgo(1), todayMid()).spend > 0) active.push(built[i]);
    ADSETS = enrich(active);
    OFFERS = buildOffers();
  }).catch(function (e) {
    if (e.message === 'auth') throw e;
    ADS_LOADED = true; ADS_ERROR = 'Could not reach the server.';
  });
}
function refreshAll(fresh) {
  setSync('Syncing');
  return Promise.all([loadAds(fresh), loadInbox()]).then(function () {
    var bad = ADS_ERROR || INBOX.error;
    setSync(bad ? 'Needs setup' : 'Live ' + new Date().toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }), !!bad);
    render();
  }).catch(function () {});
}
function loadBrand() {
  fetch(API + '/api/brand').then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.logo) { var l = document.getElementById('logo'); l.src = j.logo; l.style.display = 'block'; }
  }).catch(function () {});
}

var booted = false;
function startApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  if (!HQ_TAB) { try { HQ_TAB = sessionStorage.getItem('scc-hq-tab'); } catch (e) {} }
  var firstOpen = !HQ_TAB;
  if (!HQ_TAB) HQ_TAB = 'ads';
  render();
  refreshAll(false).then(function () {
    /* On a fresh open, lead with Notifications when something needs Rebecca */
    if (firstOpen && needsYouCount() > 0) { HQ_TAB = 'notifications'; render(); }
  });
  if (!booted) {
    booted = true;
    loadBrand();
    setInterval(function () { if (getToken()) refreshAll(false); }, 15 * 60 * 1000);
    setInterval(function () { if (getToken()) loadInbox().then(render).catch(function () {}); }, 5 * 60 * 1000);
  }
}
document.getElementById('refresh-btn').addEventListener('click', function () { refreshAll(true); });

/* Showit embed auto-height */
function broadcastHeight() {
  try { window.parent.postMessage({ type:'scc-resize', height: document.documentElement.scrollHeight }, '*'); } catch (e) {}
}
window.addEventListener('load', broadcastHeight);
window.addEventListener('resize', broadcastHeight);

checked = loadChecked();
if (getToken()) startApp(); else showLogin();
</script>
</body>
</html>
