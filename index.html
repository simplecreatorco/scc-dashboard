<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SCC Ads Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<link href="https://fonts.cdnfonts.com/css/recoleta" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy:#889CA2; --sage:#BFD9CC; --coral:#F49C8E; --teal:#B3DCDA;
    --cream:#FAF8F5; --dark:#2C3535; --mid:#4A5858; --light:#E8F0ED; --white:#FFF;
    --orange:#F4A24A; --red:#E07070; --green:#6BAF8A; --yellow:#F3B548;
    --softRed:#FCF0F0; --softGreen:#EFF7F3; --softOrange:#FDF4E7; --softSlate:#F0F4F6;
  }
  body { font-family:'Nunito',sans-serif; background:var(--cream); min-height:100vh; color:var(--dark); }
  .f-title { font-family:'Quicksand',Georgia,serif; }
  .f-recoleta { font-family:'Recoleta',Georgia,serif; }
  .f-body { font-family:'Nunito',sans-serif; }
  button { font-family:'Nunito',sans-serif; }

  .range-btn:hover { background:var(--light) !important; color:var(--dark) !important; }
  .tab-btn:hover { opacity:.88; }
  .row-hover:hover { background:#FAF8F5 !important; }

  .custom-cb { width:20px; height:20px; border-radius:6px; flex-shrink:0;
    border:2px solid var(--sage); background:#fff; margin-top:2px;
    display:flex; align-items:center; justify-content:center; transition:all .15s; cursor:pointer; }
  .custom-cb.on { background:var(--green); border-color:var(--green); }
  .custom-cb.on::after { content:'✓'; color:#fff; font-size:13px; font-weight:900; line-height:1; }

  input[type="date"] { font-family:'Nunito',sans-serif; font-size:12px;
    border:1.5px solid var(--light); border-radius:8px; padding:5px 9px;
    color:var(--dark); background:#fff; outline:none; }
  input[type="date"]:focus { border-color:var(--teal); }

  .chevron { display:inline-block; transition:transform .2s; font-size:18px; color:var(--navy); font-weight:300; user-select:none; }
  .chevron.open { transform:rotate(180deg); }
  .adset-detail { display:none; }
  .adset-detail.open { display:block; }

  .offer-card { background:#fff; border-radius:14px; padding:16px 18px; cursor:pointer;
    border:1.5px solid var(--light); box-shadow:0 2px 8px rgba(0,0,0,.04); transition:all .15s; }
  .offer-card:hover { border-color:var(--navy); transform:translateY(-2px); }

  .back-link { font-size:12px; font-weight:800; color:var(--coral); cursor:pointer;
    letter-spacing:.04em; text-transform:uppercase; display:inline-block; margin-bottom:12px; }
  .back-link:hover { color:var(--navy); }

  .prod-row { display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid var(--light); }
  .prod-row:last-child { border-bottom:none; }
  .prune-row { display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 0; border-bottom:1px solid var(--light); font-size:12.5px; }
  .prune-row:last-child { border-bottom:none; }

  .alert-strip { border-radius:12px; padding:11px 15px; margin-bottom:14px;
    font-size:13px; font-weight:700; display:flex; align-items:center; gap:9px; }

  @media (max-width:640px) {
    .camp-right { display:none !important; }
    .camp-right-mobile { display:flex !important; }
    .grid-3 { grid-template-columns:repeat(2,1fr) !important; }
    .grid-4 { grid-template-columns:repeat(2,1fr) !important; }
    .offer-grid { grid-template-columns:repeat(2,1fr) !important; }
    .offer-lower { grid-template-columns:1fr !important; }
    .tabs-row { overflow-x:auto; -webkit-overflow-scrolling:touch; gap:4px; flex-wrap:nowrap !important; }
    .tab-btn { flex:0 0 auto !important; font-size:11px !important; padding:8px 10px !important; }
    .range-row { flex-wrap:wrap !important; gap:6px !important; }
    .camp-row-inner { flex-wrap:wrap !important; gap:8px !important; padding:12px 14px !important; }
    .camp-name { white-space:normal !important; font-size:12px !important; }
    .metrics-grid { grid-template-columns:repeat(2,1fr) !important; }
    .chart-wrap { height:170px !important; }
    .summary-num { font-size:20px !important; }
    .topbar-inner { padding:10px 14px !important; }
    .topbar-title { font-size:17px !important; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="topbar-inner" style="background:var(--navy);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:58px;">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--sage));"></div>
      <span class="f-recoleta topbar-title" style="color:#fff;font-weight:900;font-size:21px;">SCC Ads Dashboard</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="sync-status" class="f-body" style="color:var(--teal);font-size:12px;font-weight:700;">⟳ Syncing…</span>
      <button id="refresh-btn" style="background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;opacity:.85;">↺ Refresh</button>
    </div>
  </div>

  <div style="max-width:1000px;margin:0 auto;padding:22px 16px 60px;">
    <div id="view"></div>
    <div style="text-align:center;margin-top:36px;padding-top:20px;border-top:1px solid var(--light);">
      <p class="f-body" style="font-size:11px;color:var(--mid);margin:0;">Simple Creator Co · Ad Set Level · Meta via Two Minute Reports + Hyros</p>
      <p class="f-body" style="font-size:11px;color:var(--mid);margin:4px 0 0;">Always review before executing. You're in control. ✨</p>
    </div>
  </div>
</div>
<script>
/* ══════════════════════════════════════════════════════════
   SCC Ads Dashboard v3 — Ad Set Level
   Data: Google Sheets (Meta via TMR + Hyros reports)
   ══════════════════════════════════════════════════════════ */

/* ── Config ─────────────────────────────────────────────── */
var META_SHEET_ID   = '1zUVhp_JUob-8PNASevaGqXyMxHl1E6zvCCNIxK_JLsM';
var HYROS_SHEET_Y   = '1k_DQPkTVzSdAeLcoULFNk-xOaneOn-equSXl8-LAihk';
var HYROS_SHEET_7   = '1SeOZj9T-d4EeszC3bA5yFgGPNUicIknopUM6xTG_eA8';
var HYROS_SHEET_30  = '11uNkbn5yKLVlBJ5BH2FjDVSM_TolUJzTJNgdg8UmghY';
var HYROS_DAILY     = '125AGooZ_Hvk9hnu1G40xTFJenUY50FdKAhREGFXue2Y';
var API_KEY         = 'AIzaSyDCo16IwVpVgHxs86yIh_njUO-KVZFdtqc';

/* Meta sheet columns (A:P) */
var M_DATE=0, M_CAMP=1, M_ADSET=2, M_AD=3, M_BUDGET=4, M_SPEND=5,
    M_CPM=8, M_CPC=10, M_CTR=11, M_PURCH=12, M_ROAS=13, M_VALUE=14, M_FREQ=15;

/* Hyros window sheets: A=Name B=Status C=Budget D=Clicks E=AdSpend F=TotalRev G=Rev H=Profit I=Net J=Sales K=ROAS */
var H_NAME=0, H_SPEND=4, H_REV=5, H_SALES=9, H_ROAS=10;

var SCALE_T = 1.4, ORANGE_T = 1.25, OFF_T = 0.75;
var PRUNE_KILL_SPEND = 100;    // $100+ spend, zero sales
var PRUNE_WATCH_SPEND = 150;   // $150+ spend, ROAS < 0.5
var CREATIVE_AGE_DAYS = 21;    // 3-week refresh nudge
var RT_FREQ_ALERT = 3.5;

/* Offers are built at load time. Product offers are fixed; every retargeting
   CAMPAIGN becomes its own offer so each RT effort is judged separately. */
var OFFERS = [];
var FIXED_OFFERS = [
  { key:'MTS',  label:'Made to Sell' },
  { key:'IPSS', label:'IPSS' },
  { key:'SOR',  label:'Sell on Repeat' }
];

/* Product classification for the Purchases tab.
   Edit these patterns if product names change in SamCart/Hyros. */
var PRODUCT_MAP = [
  { re:/made to sell|(^|\W)mts(\W|$)/i,        offer:'MTS',  role:'main'   },
  { re:/launch[- ]?ready|launch toolkit/i,      offer:'MTS',  role:'bump'   },
  { re:/hook bank/i,                            offer:'MTS',  role:'upsell' },
  { re:/bot bundle|ai bot/i,                    offer:'MTS',  role:'upsell' },
  { re:/instagram passive|(^|\W)ipss(\W|$)/i,  offer:'IPSS', role:'main'   },
  { re:/brand detective/i,                      offer:'IPSS', role:'upsell' },
  { re:/sell on repeat|(^|\W)sor(\W|$)/i,      offer:'SOR',  role:'main'   }
];
function classifyProduct(name) {
  for (var i = 0; i < PRODUCT_MAP.length; i++) {
    if (PRODUCT_MAP[i].re.test(name || '')) return PRODUCT_MAP[i];
  }
  return null;
}

function isRetargetingText(t) {
  return /\bRT\b|retarget|warm\s*rt|coupon\s*-\s*warm/i.test(t || '');
}
function isRTOffer(key) { return String(key || '').indexOf('RT::') === 0; }
function rtLabel(key) { return String(key).slice(4); }

/* Retargeting keys off the CAMPAIGN so MTS RT, PAA RT, IPSS RT stay separate */
function offerKeyFor(camp, adset) {
  var combo = (camp || '') + ' ' + (adset || '');
  if (isRetargetingText(combo)) return 'RT::' + String(camp || 'Retargeting').trim();
  if (/IPSS|instagram passive/i.test(combo)) return 'IPSS';
  if (/\bSOR\b|sell on repeat/i.test(combo)) return 'SOR';
  if (/\bMTS\b|made to sell/i.test(combo)) return 'MTS';
  return 'OTHER';
}
function offerFor(text) { return offerKeyFor(text, ''); }

function buildOffers() {
  var out = [];
  for (var f = 0; f < FIXED_OFFERS.length; f++) {
    for (var i = 0; i < ADSETS.length; i++) {
      if (ADSETS[i].offer === FIXED_OFFERS[f].key) { out.push(FIXED_OFFERS[f]); break; }
    }
  }
  var rtSpend = {};
  for (var j = 0; j < ADSETS.length; j++) {
    var s = ADSETS[j];
    if (!isRTOffer(s.offer)) continue;
    rtSpend[s.offer] = (rtSpend[s.offer] || 0) + s.d7.spend;
  }
  var keys = Object.keys(rtSpend).sort(function (a, b) { return rtSpend[b] - rtSpend[a]; });
  for (var k = 0; k < keys.length; k++) out.push({ key: keys[k], label: rtLabel(keys[k]), rt: true });
  return out;
}
function offerDef(key) {
  for (var i = 0; i < OFFERS.length; i++) if (OFFERS[i].key === key) return OFFERS[i];
  return null;
}
/* Which product offer does an RT campaign sell? Used for product panel. */
function productOfferFor(offerKey) {
  if (!isRTOffer(offerKey)) return offerKey;
  var camp = rtLabel(offerKey);
  if (/IPSS/i.test(camp)) return 'IPSS';
  if (/\bSOR\b|sell on repeat/i.test(camp)) return 'SOR';
  return 'MTS';
}
function isTrafficOnly(text) {
  return /ig followers|pinned|manychat|\(ID:\s*W\d+\)|engagement/i.test(text || '');
}

/* ── State ──────────────────────────────────────────────── */
var metaRows = [], hyrosY = null, hyros7 = null, hyros30 = null;
var hyrosDailyMap = {}, productRows = [], purchaseRows = [];
var ADSETS = [];
var PAGE = 'main', CUR_OFFER = null;
var TAB = 'actions';
var mainRange = 'd7', offerRange = 'd7', adsetRange = 'd7';
var mainCustom = {from:null,to:null}, offerCustom = {from:null,to:null}, adsetCustom = {from:null,to:null};
var mainChartTab = 'spend', offerChartTab = 'spend', adsetChartTab = 'roas';
var openDetail = {};
var checked = {};
var chartRefs = {};

/* ── Storage (checkbox persistence) ─────────────────────── */
function loadChecked() {
  try {
    var raw = localStorage.getItem('scc-checked');
    if (!raw) return {};
    var o = JSON.parse(raw);
    if (o.date !== dateKey(todayMid())) return {};
    return o.map || {};
  } catch (e) { return {}; }
}
function saveChecked() {
  try {
    localStorage.setItem('scc-checked', JSON.stringify({ date: dateKey(todayMid()), map: checked }));
  } catch (e) { /* private mode / blocked third-party storage */ }
}

/* ── Date helpers ───────────────────────────────────────── */
function todayMid() { var t = new Date(); t.setHours(0,0,0,0); return t; }
function daysAgo(n) { var d = new Date(todayMid()); d.setDate(d.getDate() - n); return d; }
function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseDate(s) {
  if (!s) return null;
  var str = String(s).trim();
  var p = str.split('-');
  if (p.length === 3 && p[0].length === 4) {
    var y = +p[0], m = +p[1], d = +String(p[2]).slice(0,2);
    if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return new Date(y, m-1, d);
  }
  var p2 = str.split('/');
  if (p2.length === 3) {
    var mm = +p2[0], dd = +p2[1], yy = +p2[2];
    if (!isNaN(yy)) return new Date(yy < 100 ? 2000+yy : yy, mm-1, dd);
  }
  return null;
}
function rangeFor(which) {
  var r, c;
  if (which === 'main')  { r = mainRange;  c = mainCustom; }
  else if (which === 'offer') { r = offerRange; c = offerCustom; }
  else { r = adsetRange; c = adsetCustom; }
  if (r === 'custom' && c.from && c.to) return { from: parseDate(c.from), to: parseDate(c.to) };
  var n = { y:1, d7:7, d14:14, d30:30 }[r] || 7;
  return { from: daysAgo(n), to: todayMid() };
}

function sameDay(a, b) { return !!a && !!b && a.getTime() === b.getTime(); }
/* Which Hyros sheet (if any) covers this exact window */
function windowKind(from, to) {
  if (!sameDay(to, todayMid())) return null;
  if (sameDay(from, daysAgo(1)))  return 'y';
  if (sameDay(from, daysAgo(7)))  return 'd7';
  if (sameDay(from, daysAgo(30))) return 'd30';
  return null;
}

/* ── Number helpers ─────────────────────────────────────── */
function num(v) {
  if (v === null || v === undefined || v === '') return 0;
  var n = parseFloat(String(v).replace(/[$,%\s]/g, ''));
  return isNaN(n) ? 0 : n;
}
function numOrNull(v) {
  if (v === null || v === undefined || v === '') return null;
  var n = parseFloat(String(v).replace(/[$,%\s]/g, ''));
  return isNaN(n) ? null : n;
}
function fC(v) { return (v === null || v === undefined || isNaN(v)) ? '—' : '$' + Math.round(v).toLocaleString('en-US'); }
function fR(v) { return (v === null || v === undefined || isNaN(v)) ? '—' : Number(v).toFixed(2); }
function fD(v) { return (v === null || v === undefined || isNaN(v)) ? '—' : '$' + Number(v).toFixed(2); }
function fPct(v) { return (v === null || v === undefined || isNaN(v)) ? '—' : Number(v).toFixed(1) + '%'; }
function roasColor(v) {
  if (v === null || v === undefined || isNaN(v)) return '#4A5858';
  if (v >= SCALE_T) return '#6BAF8A';
  if (v >= 1.0) return '#F4A24A';
  return '#E07070';
}
function idToken(name) {
  var m = String(name || '').match(/\(ID:\s*([A-Za-z0-9]+)\)/i);
  if (!m) return null;
  var raw = m[1];
  if (/^\d+$/.test(raw)) return String(parseInt(raw, 10));
  return raw.toUpperCase();
}

/* ── Fetch ──────────────────────────────────────────────── */
function fetchSheet(sheetId, range) {
  var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + sheetId +
            '/values/' + encodeURIComponent(range) + '?key=' + API_KEY;
  return fetch(url).then(function (res) {
    if (!res.ok) throw new Error('Sheets ' + res.status);
    return res.json();
  }).then(function (j) { return j.values || []; });
}

/* ── Parse Hyros window sheet → map by id + name ────────── */
function parseHyrosWindow(rows) {
  var map = {}, total = null;
  if (!rows || rows.length < 2) return { map: map, total: total };
  for (var i = 1; i < rows.length; i++) {
    var row = rows[i];
    var name = String((row[H_NAME] || '')).trim();
    if (!name) continue;
    var entry = {
      rev: numOrNull(row[H_REV]),
      roas: numOrNull(row[H_ROAS]),
      spend: numOrNull(row[H_SPEND]),
      sales: numOrNull(row[H_SALES])
    };
    if (name.toLowerCase() === 'total') { total = entry; continue; }
    var id = idToken(name);
    if (id) map['id:' + id] = entry;
    map['name:' + name.toLowerCase()] = entry;
  }
  return { map: map, total: total };
}
function matchHyros(adsetName, campaignName, parsed) {
  if (!parsed || !parsed.map) return null;
  var m = parsed.map;
  var id = idToken(adsetName) || idToken(campaignName);
  if (id && m['id:' + id]) return m['id:' + id];
  var lower = String(adsetName || '').toLowerCase();
  if (m['name:' + lower]) return m['name:' + lower];
  var clower = String(campaignName || '').toLowerCase();
  if (m['name:' + clower]) return m['name:' + clower];
  return null;
}

/* ── Parse Hyros daily sheet ────────────────────────────── */
/* cols: A=Label B=Date C=Clicks D=AdSpend E=Revenue F=Profit G=Sales H=ROAS */
function parseHyrosDaily(rows) {
  var map = {};
  if (!rows || rows.length < 2) return map;
  for (var i = 1; i < rows.length; i++) {
    var row = rows[i];
    var d = parseDate(row[1]);
    if (!d) continue;
    map[dateKey(d)] = { rev: num(row[4]), sales: num(row[6]) };
  }
  return map;
}

/* ── Parse optional product tab ─────────────────────────── */
/* cols: A=Date B=Offer C=Product D=Role(main|bump|upsell) E=Units F=Revenue */
function parseProducts(rows) {
  var out = [];
  if (!rows || rows.length < 2) return out;
  for (var i = 1; i < rows.length; i++) {
    var row = rows[i];
    var d = parseDate(row[0]);
    if (!d) continue;
    out.push({
      date: dateKey(d),
      offer: String(row[1] || '').toUpperCase().trim(),
      product: String(row[2] || '').trim(),
      role: String(row[3] || '').toLowerCase().trim(),
      units: num(row[4]),
      rev: num(row[5])
    });
  }
  return out;
}

/* ── Parse raw Purchases tab ────────────────────────────── */
/* cols: A=Date B=Order ID C=Product D=Amount */
function parsePurchases(rows) {
  var out = [];
  if (!rows || rows.length < 2) return out;
  for (var i = 1; i < rows.length; i++) {
    var row = rows[i];
    var d = parseDate(row[0]);
    if (!d) continue;
    var prod = String(row[2] || '').trim();
    if (!prod) continue;
    out.push({ dateObj: d, orderId: String(row[1] || '').trim(), product: prod, amount: num(row[3]) });
  }
  return out;
}

/* ── Build ad sets from Meta rows ───────────────────────── */
function buildAdsets() {
  var byKey = {};
  var acctDaySpend = {};

  for (var i = 1; i < metaRows.length; i++) {
    var row = metaRows[i];
    var d = parseDate(row[M_DATE]);
    if (!d) continue;
    var adset = String((row[M_ADSET] || '')).trim();
    var camp  = String((row[M_CAMP]  || '')).trim();
    if (!adset && !camp) continue;
    var key = (camp + ' ||| ' + adset).toLowerCase();
    if (!byKey[key]) byKey[key] = { adset: adset || camp, campaign: camp, rows: [] };
    byKey[key].rows.push(row);
    var dk = dateKey(d);
    acctDaySpend[dk] = (acctDaySpend[dk] || 0) + num(row[M_SPEND]);
  }

  var out = [];
  for (var k in byKey) {
    if (!byKey.hasOwnProperty(k)) continue;
    var g = byKey[k];
    var name = g.adset, camp2 = g.campaign;
    var combo = camp2 + ' ' + name;

    // daily aggregation
    var dayMap = {}, adMap = {}, firstSeen = null, budget = 0;
    for (var r = 0; r < g.rows.length; r++) {
      var rw = g.rows[r];
      var dd = parseDate(rw[M_DATE]);
      if (!dd) continue;
      var dkey = dateKey(dd);
      var sp = num(rw[M_SPEND]);
      if (!dayMap[dkey]) dayMap[dkey] = { spend:0, purch:0, val:0, freq:0, fn:0, cpm:0, cpc:0, ctr:0, cn:0 };
      var dm = dayMap[dkey];
      dm.spend += sp;
      dm.purch += num(rw[M_PURCH]);
      dm.val   += num(rw[M_VALUE]);
      var fq = num(rw[M_FREQ]);
      if (fq > 0) { dm.freq += fq; dm.fn++; }
      var cpmv = num(rw[M_CPM]);
      if (cpmv > 0) { dm.cpm += cpmv; dm.cpc += num(rw[M_CPC]); dm.ctr += num(rw[M_CTR]); dm.cn++; }
      var b = num(rw[M_BUDGET]);
      if (b > 0) budget = b;
      if (sp > 0 && (!firstSeen || dd < firstSeen)) firstSeen = dd;

      var adName = String((rw[M_AD] || '')).trim();
      if (adName) {
        if (!adMap[adName]) adMap[adName] = { name:adName, spend:0, purch:0, val:0, first:null };
        var am = adMap[adName];
        if (dd >= daysAgo(30)) { am.spend += sp; am.purch += num(rw[M_PURCH]); am.val += num(rw[M_VALUE]); }
        if (sp > 0 && (!am.first || dd < am.first)) am.first = dd;
      }
    }

    var traffic = isTrafficOnly(combo);
    var offer = offerKeyFor(camp2, name);

    var daysLive = firstSeen ? Math.floor((todayMid() - firstSeen) / 86400000) : 99;
    var isNew = daysLive < 3;

    // newest creative age
    var newest = null;
    for (var an in adMap) {
      if (!adMap.hasOwnProperty(an)) continue;
      var f = adMap[an].first;
      if (f && (!newest || f > newest)) newest = f;
    }
    var creativeAge = newest ? Math.floor((todayMid() - newest) / 86400000) : null;

    // pruning flags (30-day ad totals)

/* ── Window aggregation for one ad set ──────────────────── */

/* ── Attach windows + status ────────────────────────────── */

}

    if (mA && hA) parts.push('Meta 7-day ' + fR(m7) + ' and Hyros 7-day ' + fR(h7) + ' — both above scale threshold.');
    else if (mA) parts.push('Meta 7-day ROAS ' + fR(m7) + ' — above scale threshold.' + (h7 !== null ? ' (Hyros: ' + fR(h7) + ')' : ''));
    else if (hA) parts.push('Hyros 7-day ROAS ' + fR(h7) + ' — above scale threshold.' + (m7 !== null ? ' (Meta: ' + fR(m7) + ')' : ''));
    if ((mY !== null && mY >= SCALE_T) || (hY !== null && hY >= SCALE_T)) {
      parts.push('Yesterday strong too: ' + (mY !== null ? 'Meta ' + fR(mY) : '') + (hY !== null ? ' / Hyros ' + fR(hY) : '') + '.');
    }
    if (s.d7.cpm !== null && s.d7.cpm <= 20) parts.push('CPM ' + fD(s.d7.cpm) + ' — healthy delivery.');
  } else if (s.status === 'scale_back') {

    if ((s.d7.purch + (s.hy.sales7||0)) === 0) parts.push('No sales in 7 days on ' + fC(s.d7.spend) + ' spend. Turn it off.');
    else parts.push('Meta ' + fR(m7) + ' and Hyros ' + fR(h7) + ' both below turn-off threshold (' + OFF_T + ').');
  } else if (s.status === 'orange') {

  } else if (s.status === 'new_watch') {
    var sold = s.d7.purch;
    parts.push('Day ' + (s.daysLive + 1) + ' of 3. ' + (sold > 0 ? sold + ' sale' + (sold===1?'':'s') + ' so far.' : 'No sales yet — turns off if still zero after Day 3.'));

    else parts.push('Not enough data yet — holding.');
  }

    parts.push('⏰ Newest creative is ' + s.creativeAge + ' days old — time to refresh.');
  }

}

/* ── Offer stats ────────────────────────────────────────── */

/* ── Chart data ─────────────────────────────────────────── */

      if (!s.dayMap.hasOwnProperty(dk0)) continue;
      var d0 = parseDate(dk0);

      myDays.push(dk0);
      mySpend += s.dayMap[dk0].spend;
      if (!days[dk0]) days[dk0] = { spend:0, val:0, hRev:0 };
      days[dk0].spend += s.dayMap[dk0].spend;
      days[dk0].val   += s.dayMap[dk0].val;
    }
    if (!myDays.length) continue;

    var realTot = (kind && s.hyRaw && s.hyRaw[kind] && s.hyRaw[kind].rev !== null) ? s.hyRaw[kind].rev : null;
    var realY = (s.hyRaw && s.hyRaw.y && s.hyRaw.y.rev !== null) ? s.hyRaw.y.rev : null;
    var hasY = myDays.indexOf(yKey) !== -1;

      }

    out.hyrosRoas.push(v.spend > 0 ? +(v.hRev / v.spend).toFixed(2) : 0);
  }
  return out;
}

    '<div class="f-title" style="font-size:16px;font-weight:700;line-height:1.1;color:' + roasColor(h) + ';">' + fR(h) + '</div></div></div>';
}
function pillHTML(label, act, val, on) {
  return '<button class="range-btn f-body" data-act="' + act + '" data-v="' + val + '" style="padding:6px 14px;border-radius:20px;' +
    'border:1.5px solid ' + (on ? '#889CA2' : '#E8F0ED') + ';background:' + (on ? '#889CA2' : '#fff') + ';color:' + (on ? '#fff' : '#4A5858') +
    ';font-weight:700;font-size:12px;cursor:pointer;transition:all .15s;">' + label + '</button>';
}
function statCard(label, value, caption, color, borderCol) {
  return '<div style="background:#fff;border-radius:14px;padding:16px 18px;border:1.5px solid ' + (borderCol || '#E8F0ED') + ';box-shadow:0 2px 8px rgba(0,0,0,.04);">' +
    '<div class="f-body" style="font-size:10px;font-weight:800;color:#4A5858;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;">' + label + '</div>' +
    '<div class="f-recoleta summary-num" style="font-size:26px;font-weight:900;line-height:1.1;color:' + (color || '#2C3535') + ';">' + value + '</div>' +
    (caption ? '<div class="f-body" style="font-size:11px;color:#4A5858;margin-top:3px;">' + caption + '</div>' : '') + '</div>';
}

function scaleActionHTML(s) {
  if (s.status === 'scale') {
    if (!s.budget) return '<div class="f-body" style="font-size:12px;color:#6BAF8A;font-weight:700;margin-top:3px;">Scale 9% — set budget in Meta</div>';
    var nb = Math.round(s.budget * 1.09);
    return '<div class="f-body" style="font-size:12px;color:#6BAF8A;font-weight:700;margin-top:3px;">$' + s.budget + ' → $' + nb + '/day (+9%)</div>';
  }
  if (s.status === 'scale_back') {
    if (!s.budget) return '<div class="f-body" style="font-size:12px;color:#E07070;font-weight:700;margin-top:3px;">Scale back 20% — set budget in Meta</div>';
    var nd = Math.round(s.budget * 0.8);
    return '<div class="f-body" style="font-size:12px;color:#E07070;font-weight:700;margin-top:3px;">$' + s.budget + ' → $' + nd + '/day (−20%)</div>';
  }
  return '';
}

function rowHTML(s) {
  var isChk = !!checked[s.key];
  var showCb = (PAGE === 'main' && TAB === 'actions');
  var open = !!openDetail[s.key];
  var h = '';
  h += '<div style="border-bottom:1px solid #E8F0ED;">';
  h += '<div class="row-hover camp-row-inner" data-act="det" data-v="' + encodeURIComponent(s.key) + '" style="display:flex;align-items:flex-start;gap:12px;padding:14px 18px;cursor:pointer;' +
       'background:' + (isChk ? '#F6FAF7' : '#fff') + ';opacity:' + (isChk ? '.55' : '1') + ';border-left:3px solid ' + borderFor(s.status) + ';transition:all .15s;">';
  if (showCb) h += '<div class="custom-cb' + (isChk ? ' on' : '') + '" data-act="check" data-v="' + encodeURIComponent(s.key) + '"></div>';
  h += '<div style="flex:1;min-width:0;">';
  h += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">' + badgeHTML(s.status);
  h += '<span class="f-body" style="font-size:11px;color:#4A5858;font-weight:700;">' + (s.id ? 'ID ' + s.id + ' · ' : '') + (s.budget ? '$' + s.budget + '/day · ' : '') + s.offer + '</span></div>';
  h += '<div class="camp-name f-body" style="font-size:13px;font-weight:700;color:#2C3535;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + s.name + '</div>';
  h += '<div class="f-body" style="font-size:11px;color:#889CA2;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + s.campaign + '</div>';
  h += scaleActionHTML(s);
  if (s.isNew) h += '<div class="f-body" style="font-size:12px;color:#889CA2;font-weight:600;margin-top:3px;">Day ' + (s.daysLive+1) + ' of 3 · ' + (s.d7.purch > 0 ? s.d7.purch + ' sales' : 'No sales yet') + '</div>';
  h += '<div class="camp-right-mobile" style="display:none;align-items:center;justify-content:space-between;margin-top:8px;">' + dualRoasHTML(s.d7.metaRoas, s.hy.r7) +
       '<span class="chevron' + (open ? ' open' : '') + '">⌄</span></div>';
  h += '</div>';
  h += '<div class="camp-right" style="display:flex;align-items:center;gap:12px;flex-shrink:0;">' + dualRoasHTML(s.d7.metaRoas, s.hy.r7) +
       '<span class="chevron' + (open ? ' open' : '') + '">⌄</span></div>';
  h += '</div>';
  h += '<div class="adset-detail' + (open ? ' open' : '') + '" id="det-' + encodeURIComponent(s.key) + '">' + (open ? detailHTML(s) : '') + '</div>';
  h += '</div>';
  return h;
}

function detailHTML(s) {
  var b = rangeFor('adset');
  var w = winFor(s, b.from, b.to);
  var bgc = { scale:'#EFF7F3', scale_back:'#FDF4E7', orange:'#FDF4E7', turn_off:'#FCF0F0', new_watch:'#F0F4F6', traffic:'#F0F4F6' }[s.status] || '#F0F4F6';
  var brc = { scale:'#6BAF8A', scale_back:'#E07070', orange:'#F4A24A', turn_off:'#E07070', new_watch:'#889CA2', traffic:'#889CA2' }[s.status] || '#C0CDD0';
  var ttl = { scale:'🚀 Ready to Scale', scale_back:'📉 Scale Back Budget', orange:'🚩 Orange Flag — Watch Closely', turn_off:'⛔ Recommended: Turn Off',
              new_watch:'👁 Watching', traffic:'📣 Traffic Only', hold:'📊 Hold — Stable' }[s.status] || '📊 Hold';

  var h = '<div style="background:#FAF8F5;padding:18px 20px;border-top:1px solid #E8F0ED;">';

  // range pills
  h += '<div class="range-row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;">';
  h += '<span class="f-body" style="font-size:11px;font-weight:800;color:#4A5858;letter-spacing:.05em;text-transform:uppercase;">Window:</span>';
  h += pillHTML('7-Day', 'as-range', 'd7', adsetRange === 'd7');
  h += pillHTML('30-Day', 'as-range', 'd30', adsetRange === 'd30');
  h += pillHTML('Custom', 'as-range', 'custom', adsetRange === 'custom');
  if (adsetRange === 'custom') {
    h += '<input type="date" id="as-from" value="' + (adsetCustom.from || '') + '">';
    h += '<input type="date" id="as-to" value="' + (adsetCustom.to || '') + '">';
  }
  h += '</div>';

  // insight
  h += '<div style="background:' + bgc + ';border:1px solid ' + brc + ';border-radius:10px;padding:11px 14px;margin-bottom:16px;">';
  h += '<div class="f-body" style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;color:' + brc + ';">' + ttl + '</div>';
  h += '<div class="f-body" style="font-size:13px;color:#2C3535;line-height:1.7;">' + s.insight + '</div></div>';

  // chart
  h += '<div style="margin-bottom:16px;">';
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px;">';
  h += '<span class="f-body" style="font-size:11px;font-weight:800;color:#4A5858;letter-spacing:.06em;text-transform:uppercase;">Daily Performance</span>';
  h += '<div style="display:flex;gap:6px;">' + pillHTML('ROAS', 'as-chart', 'roas', adsetChartTab === 'roas') +
       pillHTML('Spend & Rev', 'as-chart', 'spend', adsetChartTab === 'spend') + '</div></div>';
  h += '<div style="background:#fff;border-radius:10px;border:1px solid #E8F0ED;padding:12px;position:relative;height:190px;">' +
       '<canvas id="aschart-' + encodeURIComponent(s.key) + '"></canvas></div></div>';

  // ROAS by window
  var wins = [
    ['Yesterday', s.y.metaRoas,   s.hy.yRoas],
    ['7-Day',     s.d7.metaRoas,  s.hy.r7],
    ['14-Day',    s.d14.metaRoas, null],
    ['30-Day',    s.d30.metaRoas, s.hy.r30]
  ];
  h += '<div style="margin-bottom:16px;">';
  h += '<div class="f-body" style="font-size:11px;font-weight:800;color:#4A5858;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;">ROAS by Window</div>';
  h += '<div class="grid-4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">';
  for (var i = 0; i < wins.length; i++) {
    h += '<div style="background:#fff;border-radius:10px;padding:12px 10px;border:1px solid #E8F0ED;text-align:center;">';
    h += '<div class="f-body" style="font-size:10px;color:#4A5858;font-weight:800;letter-spacing:.05em;margin-bottom:8px;text-transform:uppercase;">' + wins[i][0] + '</div>';
    h += '<div class="f-body" style="font-size:9px;color:#889CA2;font-weight:700;">Meta</div>';
    h += '<div class="f-recoleta" style="font-size:19px;font-weight:900;color:' + roasColor(wins[i][1]) + ';">' + fR(wins[i][1]) + '</div>';
    h += '<div style="height:1px;background:#E8F0ED;margin:7px 0;"></div>';
    h += '<div class="f-body" style="font-size:9px;color:#F49C8E;font-weight:700;">Hyros</div>';
    h += '<div class="f-recoleta" style="font-size:19px;font-weight:900;color:' + roasColor(wins[i][2]) + ';">' + fR(wins[i][2]) + '</div></div>';
  }
  h += '</div></div>';

  // metrics
  var mets = [
    ['Spend', fC(w.spend)],
    ['Hyros Revenue', fC(w.hyrosRev)],
    ['Meta Purchases', String(Math.round(w.purch))],
    ['CPM', fD(w.cpm)],
    ['CPC', fD(w.cpc)],
    ['CTR', fPct(w.ctr)]
  ];
  if (s.offer === 'RT' && w.freq !== null) mets.push(['Frequency', w.freq.toFixed(2) + 'x']);
  h += '<div style="background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #E8F0ED;">';
  h += '<div class="f-body" style="font-size:10px;font-weight:800;color:#4A5858;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;">Metrics</div>';
  h += '<div class="metrics-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">';
  for (var mi = 0; mi < mets.length; mi++) {
    h += '<div><div class="f-body" style="font-size:10px;color:#4A5858;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px;">' + mets[mi][0] + '</div>' +
         '<div class="f-body" style="font-size:15px;font-weight:800;color:#2C3535;">' + mets[mi][1] + '</div></div>';
  }
  h += '</div></div>';

  // creative age
  if (s.creativeAge !== null && !s.traffic) {
    var stale = s.creativeAge >= CREATIVE_AGE_DAYS;
    h += '<div style="margin-top:12px;background:' + (stale ? '#FDF4E7' : '#fff') + ';border:1px solid ' + (stale ? '#F4A24A' : '#E8F0ED') +
         ';border-radius:10px;padding:11px 14px;font-size:12.5px;color:#2C3535;">🎨 Newest creative added <b>' + s.creativeAge +
         ' day' + (s.creativeAge === 1 ? '' : 's') + ' ago</b>' + (stale ? ' — <b style="color:#F4A24A;">refresh time (3-week mark)</b>' : '') + '</div>';
  }

  // pruning
  var pr = s.pruneKill.concat(s.pruneWatch);
  if (pr.length) {
    h += '<div style="margin-top:12px;background:#fff;border-radius:10px;border:1px solid #E8F0ED;padding:14px 16px;">';
    h += '<div class="f-body" style="font-size:10px;font-weight:800;color:#4A5858;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;">Ad Pruning Flags · 30-Day</div>';
    for (var pi = 0; pi < pr.length; pi++) {
      var p = pr[pi];
      var kill = p.sales === 0;
      h += '<div class="prune-row"><span style="font-weight:700;color:#2C3535;">' + p.name + '</span>' +
           '<span style="color:' + (kill ? '#E07070' : '#F4A24A') + ';font-weight:700;white-space:nowrap;">' +
           fC(p.spend) + ' · ' + p.sales + ' sales · ' + (kill ? 'Kill it' : fR(p.roas) + 'x · Watch') + '</span></div>';
    }
    h += '</div>';
  }

  h += '</div>';
  return h;
}

/* ── Main view ──────────────────────────────────────────── */
function renderMain() {
  var b = rangeFor('main');
  var actionable = [];
  for (var i = 0; i < ADSETS.length; i++) if (!ADSETS[i].traffic) actionable.push(ADSETS[i]);

  var gScale = [], gBack = [], gOff = [], gFlag = [], gNew = [];
  for (var a = 0; a < actionable.length; a++) {
    var st = actionable[a].status;
    if (st === 'scale') gScale.push(actionable[a]);
    else if (st === 'scale_back') gBack.push(actionable[a]);
    else if (st === 'turn_off') gOff.push(actionable[a]);
    else if (st === 'orange') gFlag.push(actionable[a]);
    else if (st === 'new_watch') gNew.push(actionable[a]);
  }
  var gAll = ADSETS.slice().sort(function (x, y) {
    var xt = x.firstSeen ? x.firstSeen.getTime() : 0;
    var yt = y.firstSeen ? y.firstSeen.getTime() : 0;
    return yt - xt;
  });
  var groups = { actions: gScale.concat(gBack).concat(gOff), flagged: gFlag, new: gNew, all: gAll };
  var shown = groups[TAB] || gAll;

  // account totals
  var totSpend = 0, totRev = 0;
  for (var q = 0; q < ADSETS.length; q++) {
    var w = winFor(ADSETS[q], b.from, b.to);
    totSpend += w.spend;
    if (w.hyrosRev !== null) totRev += w.hyrosRev;
  }
  var totRoas = totSpend > 0 && totRev > 0 ? totRev/totSpend : null;

  var h = '';

  // RT frequency alert
  for (var f = 0; f < ADSETS.length; f++) {
    var s2 = ADSETS[f];
    if (s2.offer === 'RT' && !s2.traffic && s2.d7.freq !== null && s2.d7.freq >= RT_FREQ_ALERT) {
      h += '<div class="alert-strip" style="background:#FDF4E7;color:#F4A24A;border:1px solid #F4A24A;">' +
           '⚠️ Retargeting frequency at ' + s2.d7.freq.toFixed(1) + 'x (7-day) — pool is getting tired. Cut budget gradually; don\'t pause.</div>';
      break;
    }
  }

  // range pills
  h += '<div class="range-row" style="display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap;">';
  h += '<span class="f-body" style="font-size:12px;font-weight:800;color:#4A5858;letter-spacing:.05em;text-transform:uppercase;margin-right:4px;">Viewing:</span>';
  h += pillHTML('Yesterday', 'main-range', 'y', mainRange === 'y');
  h += pillHTML('7-Day', 'main-range', 'd7', mainRange === 'd7');
  h += pillHTML('30-Day', 'main-range', 'd30', mainRange === 'd30');
  h += pillHTML('Custom', 'main-range', 'custom', mainRange === 'custom');
  if (mainRange === 'custom') {
    h += '<input type="date" id="mn-from" value="' + (mainCustom.from || '') + '">';
    h += '<input type="date" id="mn-to" value="' + (mainCustom.to || '') + '">';
  }
  h += '</div>';

  // performance chart
  h += '<div style="background:#fff;border-radius:16px;border:1.5px solid #E8F0ED;padding:18px 20px 14px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.04);">';
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;">';
  h += '<span class="f-body" style="font-size:12px;font-weight:800;color:#4A5858;letter-spacing:.05em;text-transform:uppercase;">Performance</span>';
  h += '<div style="display:flex;gap:6px;">' + pillHTML('Spend & Revenue', 'main-chart', 'spend', mainChartTab === 'spend') +
       pillHTML('ROAS', 'main-chart', 'roas', mainChartTab === 'roas') + '</div></div>';
  h += '<div class="chart-wrap" style="position:relative;height:210px;"><canvas id="main-chart"></canvas></div></div>';

  // summary cards
  h += '<div class="grid-3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px;">';
  h += statCard('Total Spend', fC(totSpend), null, '#2C3535', '#B3DCDA');
  h += statCard('Hyros Revenue', fC(totRev > 0 ? totRev : null), null, '#2C3535', '#BFD9CC');
  h += statCard('Hyros ROAS', fR(totRoas), null, roasColor(totRoas), roasColor(totRoas));
  h += '</div>';

  h += '<div class="grid-3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;">';
  h += statCard('Active Ad Sets', String(ADSETS.length), null, '#2C3535', '#E8F0ED');
  h += statCard('Ready to Scale', String(gScale.length), null, '#6BAF8A', '#6BAF8A');
  h += statCard('Need Attention', String(gFlag.length + gOff.length + gBack.length), null, (gOff.length || gBack.length) ? '#E07070' : '#F4A24A', (gOff.length || gBack.length) ? '#E07070' : '#F4A24A');
  h += '</div>';

  // offer cards
  h += '<div class="f-body" style="font-size:12px;font-weight:800;color:#4A5858;letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px;">Offers</div>';
  var cols = OFFERS.length >= 4 ? 4 : (OFFERS.length || 1);
  h += '<div class="offer-grid" style="display:grid;grid-template-columns:repeat(' + cols + ',1fr);gap:12px;margin-bottom:24px;">';
  for (var o = 0; o < OFFERS.length; o++) {
    var od2 = OFFERS[o];
    var os = offerStats(od2.key, b.from, b.to);
    var showRoas = os.roas !== null ? os.roas : os.metaRoas;
    h += '<div class="offer-card" data-act="offer" data-v="' + encodeURIComponent(od2.key) + '">';
    h += '<div class="f-body" style="font-size:10px;font-weight:800;color:' + (od2.rt ? '#889CA2' : '#F49C8E') +
         ';letter-spacing:.07em;text-transform:uppercase;line-height:1.35;min-height:26px;">' +
         (od2.rt ? '🔁 ' : '') + od2.label + '</div>';
    h += '<div class="f-recoleta" style="font-size:28px;font-weight:900;line-height:1.1;margin:6px 0 2px;color:' + roasColor(showRoas) + ';">' + fR(showRoas) + '</div>';
    h += '<div class="f-body" style="font-size:11px;color:#4A5858;">ROAS · ' + fC(os.spend) + ' spend</div>';
    h += '<div class="f-body" style="font-size:11px;color:#889CA2;margin-top:2px;">' + os.sets.length + ' ad set' + (os.sets.length === 1 ? '' : 's') + ' →</div>';
    h += '</div>';
  }
  h += '</div>';

  // tabs
  var counts = { actions: groups.actions.length, flagged: groups.flagged.length, new: groups.new.length, all: groups.all.length };
  var tabDefs = [['actions',"Today's Actions"],['flagged','Orange Flags'],['new','New'],['all','All Ad Sets']];
  h += '<div class="tabs-row" style="display:flex;gap:4px;margin-bottom:14px;background:#fff;padding:4px;border-radius:14px;border:1px solid #E8F0ED;">';
  for (var t = 0; t < tabDefs.length; t++) {
    var on = TAB === tabDefs[t][0];
    h += '<button class="tab-btn f-body" data-act="tab" data-v="' + tabDefs[t][0] + '" style="flex:1;padding:9px 4px;border-radius:11px;border:none;cursor:pointer;' +
      'background:' + (on ? '#889CA2' : 'transparent') + ';color:' + (on ? '#fff' : '#4A5858') + ';font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;">' +
      tabDefs[t][1] + '<span style="background:' + (on ? '#F49C8E' : '#E8F0ED') + ';color:' + (on ? '#fff' : '#4A5858') +
      ';border-radius:20px;padding:1px 7px;font-size:11px;font-weight:900;">' + counts[tabDefs[t][0]] + '</span></button>';
  }
  h += '</div>';

  var headings = { actions:"✅ Today's Action Items", flagged:"🚩 Monitor daily. Don't make hasty calls.", new:"👁 New Ad Sets — Under Watch", all:"📊 All Ad Sets" };
  h += '<h2 class="f-recoleta" style="font-size:20px;font-weight:400;color:#2C3535;margin:0 0 12px;">' + headings[TAB] + '</h2>';

  h += '<div style="background:#fff;border-radius:16px;border:1.5px solid #E8F0ED;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05);">';
  if (!shown.length) h += '<div class="f-body" style="text-align:center;padding:48px 20px;color:#4A5858;font-size:15px;">Nothing here today! 🎉</div>';
  else for (var r2 = 0; r2 < shown.length; r2++) h += rowHTML(shown[r2]);
  h += '</div>';

  document.getElementById('view').innerHTML = h;

  var series = dailySeries(ADSETS, b.from, b.to);
  drawLineChart('main-chart', series, mainChartTab, 'main');
  redrawOpenDetails();
}

/* ── Offer view ─────────────────────────────────────────── */
function renderOffer() {
  var od = offerDef(CUR_OFFER);
  if (!od) { PAGE = 'main'; return renderMain(); }
  var b = rangeFor('offer');
  var st = offerStats(od.key, b.from, b.to);

  var h = '';
  h += '<span class="back-link" data-act="back">← Back to Account Overview</span>';
  h += '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;">';
  h += '<h1 class="f-recoleta" style="font-size:28px;font-weight:900;color:#2C3535;margin:0;">' + (od.rt ? '🔁 ' : '') + od.label + '</h1>';
  h += '<div class="range-row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">';
  h += pillHTML('7-Day', 'of-range', 'd7', offerRange === 'd7');
  h += pillHTML('30-Day', 'of-range', 'd30', offerRange === 'd30');
  h += pillHTML('Custom', 'of-range', 'custom', offerRange === 'custom');
  if (offerRange === 'custom') {
    h += '<input type="date" id="of-from" value="' + (offerCustom.from || '') + '">';
    h += '<input type="date" id="of-to" value="' + (offerCustom.to || '') + '">';
  }
  h += '</div></div>';

  if (st.totalSets > 0 && st.matchedSets < st.totalSets) {
    h += '<div class="alert-strip" style="background:#FDF4E7;color:#F4A24A;border:1px solid #F4A24A;">' +
         '⚠️ Hyros matched ' + st.matchedSets + ' of ' + st.totalSets + ' ad sets here. Unmatched ones fall back to an estimate — ' +
         'check that the Hyros report uses the same ad set names.</div>';
  }
  if (offerRange === 'custom') {
    h += '<div class="alert-strip" style="background:#F0F4F6;color:#4A5858;border:1px solid #C0CDD0;">' +
         'ℹ️ Custom ranges use estimated Hyros revenue. 7-day and 30-day use exact Hyros figures.</div>';
  }
  var rangeCap = offerRange === 'd7' ? 'Last 7 days' : (offerRange === 'd30' ? 'Last 30 days' : 'Custom range');
  h += '<div class="grid-4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;">';
  h += statCard('Ad Spend', fC(st.spend), rangeCap, '#2C3535', '#B3DCDA');
  h += statCard('Revenue', fC(st.rev), 'Hyros attributed', '#2C3535', '#BFD9CC');
  h += statCard('ROAS', st.roas !== null ? fR(st.roas) + 'x' : '—', st.roas !== null ? (st.roas >= 1 ? 'Above break-even' : 'Below break-even') : '', roasColor(st.roas), roasColor(st.roas));
  h += statCard('Profit', fC(st.profit), 'Revenue − Spend', st.profit !== null ? (st.profit >= 0 ? '#6BAF8A' : '#E07070') : '#2C3535', '#E8F0ED');
  h += '</div>';

  h += '<div class="offer-lower" style="display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:22px;">';

  h += '<div style="background:#fff;border-radius:16px;border:1.5px solid #E8F0ED;padding:18px 20px 14px;box-shadow:0 2px 10px rgba(0,0,0,.04);">';
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">';
  h += '<span class="f-recoleta" style="font-size:18px;font-weight:900;color:#2C3535;">Offer Performance</span>';
  h += '<div style="display:flex;gap:6px;">' + pillHTML('Spend & Revenue', 'of-chart', 'spend', offerChartTab === 'spend') +
       pillHTML('ROAS', 'of-chart', 'roas', offerChartTab === 'roas') + '</div></div>';
  h += '<div style="position:relative;height:230px;"><canvas id="offer-chart"></canvas></div></div>';

  h += '<div style="display:flex;flex-direction:column;gap:12px;">';
  h += '<div style="background:#fff;border-radius:14px;border:1.5px solid #E8F0ED;padding:16px;display:flex;justify-content:space-around;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,.04);">';
  h += '<div style="text-align:center;"><div class="f-body" style="font-size:10px;font-weight:800;color:#F49C8E;letter-spacing:.07em;text-transform:uppercase;">AOV</div>' +
       '<div class="f-recoleta" style="font-size:24px;font-weight:900;color:#2C3535;">' + (st.aov !== null ? '$' + Math.round(st.aov) : '—') + '</div></div>';
  h += '<div style="text-align:center;"><div class="f-body" style="font-size:10px;font-weight:800;color:#F49C8E;letter-spacing:.07em;text-transform:uppercase;">Cost/Buyer</div>' +
       '<div class="f-recoleta" style="font-size:24px;font-weight:900;color:#2C3535;">' + (st.cpb !== null ? '$' + Math.round(st.cpb) : '—') + '</div></div>';
  h += '</div>';

  h += '<div style="background:#fff;border-radius:14px;border:1.5px solid #E8F0ED;padding:16px;flex:1;box-shadow:0 2px 8px rgba(0,0,0,.04);">';
  h += '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">' +
       '<span class="f-body" style="font-size:10px;font-weight:800;color:#4A5858;letter-spacing:.07em;text-transform:uppercase;">Product</span>' +
       '<span class="f-body" style="font-size:10px;font-weight:800;color:#4A5858;letter-spacing:.07em;text-transform:uppercase;">Units · Conv.</span></div>';
  if (!st.products.length) {
    h += '<div class="f-body" style="font-size:12.5px;color:#4A5858;padding:10px 0;line-height:1.6;">No purchase data yet. Add a <b>Purchases</b> tab to the Meta sheet with columns:<br><b>Date · Order ID · Product · Amount</b><br><span style="font-size:11.5px;color:#889CA2;">One row per line item. Bump and upsell rates are calculated from orders automatically.</span></div>';
  } else {
    for (var p = 0; p < st.products.length; p++) {
      var pr = st.products[p];
      var roleLab = { main:'Main Offer', bump:'Bump', upsell:'Upsell' }[pr.role] || pr.role;
      var conv = (pr.role !== 'main' && st.mainUnits > 0) ? Math.round((pr.units / st.mainUnits) * 100) : null;
      h += '<div class="prod-row"><div style="min-width:0;"><span class="f-body" style="font-weight:800;color:#2C3535;font-size:13px;">' + roleLab + '</span>' +
           '<span class="f-body" style="font-size:12px;color:#4A5858;"> — ' + pr.product + '</span></div>' +
           '<div style="display:flex;gap:14px;align-items:center;flex-shrink:0;">' +
           '<span class="f-recoleta" style="font-size:17px;font-weight:900;color:#2C3535;">' + pr.units + '</span>' +
           '<span class="f-body" style="font-size:12px;color:#4A5858;width:34px;text-align:right;">' + (conv !== null ? conv + '%' : '') + '</span></div></div>';
    }
  }
  h += '</div></div></div>';

  h += '<div class="f-body" style="font-size:12px;font-weight:800;color:#4A5858;letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px;">Ad Sets — ' + od.label + '</div>';
  h += '<div style="background:#fff;border-radius:16px;border:1.5px solid #E8F0ED;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05);">';
  if (!st.sets.length) h += '<div class="f-body" style="text-align:center;padding:48px 20px;color:#4A5858;font-size:15px;">No active ad sets for this offer.</div>';
  else {
    var sorted = st.sets.slice().sort(function (x, y) {
      var order = { scale:0, turn_off:1, orange:2, new_watch:3, hold:4, traffic:5 };
      return (order[x.status] || 9) - (order[y.status] || 9);
    });
    for (var s3 = 0; s3 < sorted.length; s3++) h += rowHTML(sorted[s3]);
  }
  h += '</div>';

  document.getElementById('view').innerHTML = h;
  var series = dailySeries(st.sets, b.from, b.to);
  drawLineChart('offer-chart', series, offerChartTab, 'offer');
  redrawOpenDetails();
}

function redrawOpenDetails() {
  for (var k in openDetail) {
    if (!openDetail.hasOwnProperty(k) || !openDetail[k]) continue;
    var s = null;
    for (var i = 0; i < ADSETS.length; i++) if (ADSETS[i].key === k) s = ADSETS[i];
    if (!s) continue;
    var b = rangeFor('adset');
    var series = dailySeries([s], b.from, b.to);
    drawLineChart('aschart-' + encodeURIComponent(s.key), series, adsetChartTab, 'as-' + k);
  }
}

function render() {
  if (PAGE === 'offer') renderOffer();
  else renderMain();
  setTimeout(broadcastHeight, 120);
}

/* ── Events ─────────────────────────────────────────────── */
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t) return;
  var act = t.getAttribute('data-act');
  var v = t.getAttribute('data-v');

  if (act === 'check') {
    e.stopPropagation();
    var ck = decodeURIComponent(v);
    checked[ck] = !checked[ck];
    saveChecked();
    render();
    return;
  }
  if (act === 'det') {
    var dk2 = decodeURIComponent(v);
    openDetail[dk2] = !openDetail[dk2];
    render();
    return;
  }
  if (act === 'tab')        { TAB = v; render(); }
  else if (act === 'offer') { PAGE = 'offer'; CUR_OFFER = decodeURIComponent(v); openDetail = {}; render(); }
  else if (act === 'back')  { PAGE = 'main'; CUR_OFFER = null; openDetail = {}; render(); }
  else if (act === 'main-range') { mainRange = v; render(); }
  else if (act === 'of-range')   { offerRange = v; render(); }
  else if (act === 'as-range')   { adsetRange = v; render(); }
  else if (act === 'main-chart') { mainChartTab = v; render(); }
  else if (act === 'of-chart')   { offerChartTab = v; render(); }
  else if (act === 'as-chart')   { adsetChartTab = v; render(); }
});

document.addEventListener('change', function (e) {
  var id = e.target.id;
  if (id === 'mn-from' || id === 'mn-to') {
    var f = document.getElementById('mn-from'), t2 = document.getElementById('mn-to');
    if (f && t2 && f.value && t2.value) { mainCustom = { from:f.value, to:t2.value }; render(); }
  }
  if (id === 'of-from' || id === 'of-to') {
    var f2 = document.getElementById('of-from'), t3 = document.getElementById('of-to');
    if (f2 && t3 && f2.value && t3.value) { offerCustom = { from:f2.value, to:t3.value }; render(); }
  }
  if (id === 'as-from' || id === 'as-to') {
    var f3 = document.getElementById('as-from'), t4 = document.getElementById('as-to');
    if (f3 && t4 && f3.value && t4.value) { adsetCustom = { from:f3.value, to:t4.value }; render(); }
  }
});

var rb = document.getElementById('refresh-btn');
if (rb) rb.addEventListener('click', loadData);

/* ── Load ───────────────────────────────────────────────── */
function loadData() {
  var st = document.getElementById('sync-status');
  st.style.color = '#B3DCDA'; st.style.opacity = '1'; st.textContent = '⟳ Syncing…';

  Promise.all([
    fetchSheet(META_SHEET_ID, 'Meta Ads Data!A:P'),
    fetchSheet(HYROS_SHEET_Y, 'A:K').catch(function () { return []; }),
    fetchSheet(HYROS_SHEET_7, 'A:K').catch(function () { return []; }),
    fetchSheet(HYROS_SHEET_30, 'A:K').catch(function () { return []; }),
    fetchSheet(HYROS_DAILY, 'A:H').catch(function () { return []; }),
    fetchSheet(META_SHEET_ID, 'Hyros Products!A:F').catch(function () { return []; }),
    fetchSheet(META_SHEET_ID, 'Purchases!A:D').catch(function () { return []; })
  ]).then(function (res) {
    metaRows = res[0];
    hyrosY = parseHyrosWindow(res[1]);
    hyros7 = parseHyrosWindow(res[2]);
    hyros30 = parseHyrosWindow(res[3]);
    hyrosDailyMap = parseHyrosDaily(res[4]);
    productRows = parseProducts(res[5]);
    purchaseRows = parsePurchases(res[6]);

    var built = buildAdsets();
    // active only: spent something yesterday
    var active = [];
    for (var i = 0; i < built.length; i++) {
      var yw = winFor(built[i], daysAgo(1), todayMid());
      if (yw.spend > 0) active.push(built[i]);
    }
    ADSETS = enrich(active);
    OFFERS = buildOffers();

    var now = new Date();
    st.style.color = '#fff'; st.style.opacity = '.75';
    st.textContent = '✓ Live · ' + now.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
    render();
  }).catch(function (e) {
    st.style.color = '#F49C8E'; st.style.opacity = '1';
    st.textContent = '⚠ Load error';
    document.getElementById('view').innerHTML =
      '<div class="f-body" style="text-align:center;padding:48px 20px;color:#4A5858;">Could not load sheet data.<br><span style="font-size:12px;">' + e.message + '</span></div>';
  });
}

/* ── Showit embed auto-height ───────────────────────────── */
function broadcastHeight() {
  try { window.parent.postMessage({ type:'scc-resize', height: document.documentElement.scrollHeight }, '*'); } catch (e) {}
}
window.addEventListener('load', broadcastHeight);
window.addEventListener('resize', broadcastHeight);

checked = loadChecked();
loadData();
setInterval(loadData, 15 * 60 * 1000);

</script>
</body>
</html>
